server.port=${PORT:8080}
spring.application.name=kong-chatbot
spring.jackson.deserialization.fail-on-unknown-properties=false

# Kong must be configured with matching routes. Attach RAG and guardrail policies
# to their respective routes in Kong; model credentials stay in the gateway.
kong.url=${KONG_URL:http://localhost:8000}
kong.rag-route=${KONG_RAG_ROUTE:/rag/v1/chat/completions}
kong.support-route=${KONG_SUPPORT_ROUTE:/support/v1/chat/completions}
kong.model=${KONG_MODEL:my-gpt}
kong.connect-timeout=${KONG_CONNECT_TIMEOUT:2s}
kong.read-timeout=${KONG_READ_TIMEOUT:30s}
