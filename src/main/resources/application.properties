server.port=${PORT:8080}
spring.application.name=kong-chatbot
spring.jackson.deserialization.fail-on-unknown-properties=false

# Kong must be configured with matching routes. Attach RAG and guardrail policies
# to their respective routes in Kong; model credentials stay in the gateway.
kong.url=${KONG_URL:http://localhost:8000}
kong.rag-route=${KONG_RAG_ROUTE:/rag/v1/chat/completions}
kong.support-route=${KONG_SUPPORT_ROUTE:/support/v1/chat/completions}
kong.model=${KONG_MODEL:my-gpt}
kong.connect-timeout=${KONG_CONNECT_TIMEOUT:2s}
kong.read-timeout=${KONG_READ_TIMEOUT:30s}
kong.embeddings-route=${KONG_EMBEDDINGS_ROUTE:/embeddings/api/embed}

# gateway preserves Kong/Konnect retrieval. local reembeds read-only documents
# through Kong at startup; only the source volume persists, not the vector index.
rag.mode=${RAG_MODE:gateway}
rag.documents-path=${RAG_DOCUMENTS_PATH:knowledge}
rag.embedding-model=${RAG_EMBEDDING_MODEL:nomic-embed-text}
rag.top-k=${RAG_TOP_K:3}
rag.min-score=${RAG_MIN_SCORE:0.35}
rag.chunk-size=${RAG_CHUNK_SIZE:1200}
rag.chunk-overlap=${RAG_CHUNK_OVERLAP:200}
rag.max-context-chars=${RAG_MAX_CONTEXT_CHARS:6000}
